<!doctype html>
<html lang="ja" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · ページが見つかりません — Workspace</title>
    <!-- Apply the saved theme before stylesheets or deferred UI scripts can paint. -->
    <script src="../assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/css/ui.css">
    <link rel="stylesheet" href="../assets/css/templates.css">
    <script defer src="../assets/js/ui.js"></script>
    <script defer src="../assets/js/templates.js"></script>
  </head>
  <body class="ui-app service-template" data-template="error" data-ui-theme-persist>
    <a class="template-skip" href="#main">コンテンツへ移動</a>
    <header class="ui-header ui-header-sticky">
      <div class="ui-container ui-header-inner">
        <a class="ui-brand" href="dashboard.html"><span class="template-brand-mark" icon="mdi-view-dashboard" aria-hidden="true"></span> Workspace</a>

        <div class="ui-header-actions">
          <label class="template-palette-label">
            <span class="visually-hidden">カラーパレット</span>
            <select class="form-select form-select-sm" data-ui-palette-select>
              <option value="default">標準</option>
              <option value="slate">スレート</option>
              <option value="sage">セージ</option>
              <option value="teal">ティール</option>
              <option value="mauve">モーブ</option>
              <option value="sand">サンド</option>
              <option value="clay">クレイ</option>
            </select>
          </label>
          <label class="template-design-label">
            <span class="visually-hidden">デザインテーマ</span>
            <select class="form-select form-select-sm" data-ui-theme-select>
              <option value="default">標準</option>
              <option value="glass">ガラス</option>
              <option value="glassmorphism">グラスモーフィズム</option>
              <option value="flat">フラット</option>
              <option value="soft">ソフト</option>
            </select>
          </label>
          <button type="button" class="btn btn-sm btn-outline-secondary btn-icon-only" data-ui-toggle="theme" data-ui-theme-icon icon="mdi-weather-night" aria-label="ダークに切替" title="ダークに切替"></button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1" class="ui-container ui-app-main template-error">
      <article class="ui-card template-error-card" aria-labelledby="error-title" aria-describedby="error-description">
        <div class="ui-card-body template-error-body">
          <p class="template-error-code" aria-hidden="true">404</p>
          <h1 id="error-title"><span class="visually-hidden">エラー404： </span>ページが見つかりません</h1>
          <p id="error-description" class="template-error-description">URLが変更されたか、ページが削除された可能性があります。</p>
          <div class="template-error-actions">
              <a class="btn btn-primary" href="dashboard.html"><span icon="mdi-home-outline" aria-hidden="true"></span>ホームへ戻る</a>
              <a class="btn btn-outline-secondary" href="docs.html">ドキュメントを見る</a>
          </div>
          <section class="template-error-help" aria-labelledby="error-help-title">
            <h2 id="error-help-title">アクセス先を確認する</h2>
            <p>URLに入力間違いがないか確認してください。ブックマークから開いた場合は、ホームから目的のページを探せます。</p>
          </section>
        </div>
      </article>
    </main>
    <footer class="ui-footer">
      <div class="ui-container ui-footer-inner">
        <p>Workspace</p>
        <nav class="ui-cluster" aria-label="関連リンク"><a href="docs.html">ヘルプとガイド</a><a href="../templates.html#template-errors">テンプレート一覧</a></nav>
      </div>
    </footer>
  </body>
</html>
