name: Release Kav-UI

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (e.g. v1.0.0 or v1.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kav-ui-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the version tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Test the distribution package
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'

      - name: Build ZIP and SHA-256
        run: python3 scripts/build-release.py --version "$RELEASE_TAG" --output dist

      - name: Publish the release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
