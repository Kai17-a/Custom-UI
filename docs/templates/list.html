  <body class="ui-app service-template" data-template="list" data-ui-theme-persist>
    <a class="template-skip" href="#main">コンテンツへ移動</a>
    <header class="ui-header ui-header-sticky">
      <div class="ui-container ui-header-inner">
        <a class="ui-brand" href="dashboard.html"><span class="template-brand-mark" icon="mdi-view-dashboard" aria-hidden="true"></span> Workspace</a>
        <nav class="ui-header-nav nav-nowrap" aria-label="サービス">
          <a href="docs.html">ドキュメント</a>
          <a href="dashboard.html">ダッシュボード</a>
          <a href="changelog.html">更新履歴</a>
        </nav>
        <div class="ui-header-actions sp-gap-1">
          <label class="fx-inline fx-items-center small sp-gap-1 type-nowrap">
            <span>デザイン</span>
            <select class="form-select form-select-sm ui-w-auto" data-ui-theme-select>
              <option value="default">標準</option>
              <option value="glass">ガラス</option>
              <option value="glassmorphism">グラスモーフィズム</option>
              <option value="flat">フラット</option>
              <option value="soft">ソフト</option>
            </select>
          </label>
          <label class="fx-inline fx-items-center small sp-gap-1 type-nowrap">
            <span>配色</span>
            <select class="form-select form-select-sm ui-w-auto" data-ui-palette-select>
              <option value="default">標準</option>
              <option value="slate">スレート</option>
              <option value="sage">セージ</option>
              <option value="teal">ティール</option>
              <option value="mauve">モーブ</option>
              <option value="sand">サンド</option>
              <option value="clay">クレイ</option>
            </select>
          </label>
          <button type="button" class="btn btn-sm btn-outline-secondary btn-icon-only" data-ui-toggle="theme" data-ui-theme-icon icon="mdi-weather-night" aria-label="ダークに切替" title="ダークに切替"></button>
        </div>
      </div>
    </header>
    <main id="main" class="ui-container ui-layout ui-app-main">
<!-- kav-sample:start -->
<div class="ui-page">
  <div class="ui-page-body">
    <header class="ui-page-header">
      <div class="ui-page-heading">
        <p class="ui-page-eyebrow">木の葉制作室</p>
        <h1 class="ui-page-title">プロジェクト一覧</h1>
        <p class="ui-page-description">名前や状態（進行中・完了・準備中）を入力して絞り込めます。</p>
      </div>
    </header>
    <div class="ui-data-table" data-ui-data-table data-ui-page-size="3">
      <div class="ui-data-table-toolbar">
        <label class="ui-data-table-search" for="project-search">名前・状態で絞り込み
          <input class="form-control" id="project-search" name="query" type="search" data-ui-table-search placeholder="例：進行中">
        </label>
        <label class="ui-data-table-size fx-self-end" for="project-size">表示件数
          <select class="form-select" id="project-size" data-ui-table-page-size>
            <option value="3">3件</option>
            <option value="10">10件</option>
          </select>
        </label>
      </div>
      <div class="ui-table-scroll" tabindex="0" role="region" aria-label="プロジェクト一覧">
        <table class="table">
          <caption>制作プロジェクト</caption>
          <thead>
            <tr>
              <th scope="col">
                <button class="ui-data-table-sort" type="button" data-ui-table-sort="text">名前</button>
              </th>
              <th scope="col">状態</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr data-ui-row-id="project-0">
              <td>秋の展示会</td>
              <td><span class="badge badge-neutral">進行中</span></td>
              <td><a href="detail.html">詳細を見る</a></td>
            </tr>
            <tr data-ui-row-id="project-1">
              <td>資料アーカイブ</td>
              <td><span class="badge text-bg-success">完了</span></td>
              <td><a href="detail.html">詳細を見る</a></td>
            </tr>
            <tr data-ui-row-id="project-2">
              <td>冬の案内状</td>
              <td><span class="badge badge-neutral">準備中</span></td>
              <td><a href="detail.html">詳細を見る</a></td>
            </tr>
            <tr data-ui-row-id="project-3">
              <td>作品撮影</td>
              <td><span class="badge badge-neutral">進行中</span></td>
              <td><a href="detail.html">詳細を見る</a></td>
            </tr>
            <tr data-ui-row-id="project-4">
              <td>会場レイアウト</td>
              <td><span class="badge badge-neutral">準備中</span></td>
              <td><a href="detail.html">詳細を見る</a></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 0件時の行はData tableが自動表示します。 -->
      <div class="ui-data-table-footer">
        <p class="ui-data-table-summary" data-ui-table-status role="status"></p>
        <nav class="ui-data-table-pagination" aria-label="プロジェクトのページ送り">
          <button class="btn btn-outline-secondary" type="button" data-ui-table-prev>前へ</button>
          <span data-ui-table-page-status></span>
          <button class="btn btn-outline-secondary" type="button" data-ui-table-next>次へ</button>
        </nav>
      </div>
    </div>
  </div>
</div>
<!-- kav-sample:end -->
    </main>
    <footer class="ui-footer">
      <div class="ui-container ui-footer-inner">
        <p>Workspace · Kav-UI サービステンプレート</p>

          <a href="../templates.html">テンプレート一覧</a>
          <a href="../index.html">UIカタログ</a>
        </div>
      </div>
    </footer>
  </body>
</html>
