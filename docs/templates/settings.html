<!doctype html>
<html lang="ja" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ワークスペース設定 — 木の葉制作室</title>
    <!-- Apply the saved theme before stylesheets or deferred UI scripts can paint. -->
    <script src="../assets/ui/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/ui/css/ui.css">
    <link rel="stylesheet" href="../assets/css/templates.css">
    <script defer src="../assets/ui/js/ui.js"></script>
    <script defer src="../assets/js/templates.js"></script>

<!-- Kav-UI AI discovery -->
<link rel="describedby" type="text/plain" href="../llms.txt">
<link rel="alternate" type="text/markdown" href="settings.html.md">

</head>
  <body class="ui-app service-template" data-template="settings" data-ui-theme-persist>
    <a class="template-skip" href="#main">コンテンツへ移動</a>
    <header class="ui-header ui-header-sticky">
      <div class="ui-container ui-header-inner">
        <a class="ui-brand" href="dashboard.html"><span class="template-brand-mark" icon="mdi-view-dashboard" aria-hidden="true"></span> Workspace</a>
        <nav class="ui-header-nav" aria-label="サービス">
          <a href="docs.html">ドキュメント</a>
          <a href="dashboard.html">ダッシュボード</a>
          <a href="changelog.html">更新履歴</a>
        </nav>
        <div class="ui-header-actions">
          <label class="template-palette-label">
            <span>配色</span>
            <select class="form-select form-select-sm" data-ui-palette-select>
              <option value="default">標準</option>
              <option value="slate">スレート</option>
              <option value="sage">セージ</option>
              <option value="teal">ティール</option>
              <option value="mauve">モーブ</option>
              <option value="sand">サンド</option>
              <option value="clay">クレイ</option>
            </select>
          </label>
          <label class="template-design-label">
            <span>デザイン</span>
            <select class="form-select form-select-sm" data-ui-theme-select>
              <option value="default">標準</option>
              <option value="glass">ガラス</option>
              <option value="glassmorphism">グラスモーフィズム</option>
              <option value="flat">フラット</option>
              <option value="soft">ソフト</option>
            </select>
          </label>
          <button type="button" class="btn btn-sm btn-outline-secondary btn-icon-only" data-ui-toggle="theme" data-ui-theme-icon icon="mdi-weather-night" aria-label="ダークに切替" title="ダークに切替"></button>
        </div>
      </div>
    </header>
    <main id="main" class="ui-container ui-layout ui-app-main">
<!-- kav-sample:start -->
<div class="ui-page">
  <div class="ui-page-body">
    <header class="ui-page-header">
      <div class="ui-page-heading">
        <p class="ui-page-eyebrow">木の葉制作室</p>
        <h1 class="ui-page-title">ワークスペース設定</h1>
        <p class="ui-page-description">チームの基本情報と通知の受け取り方を変更します。</p>
      </div>
    </header>
    <form class="ui-stack" action="/settings" method="post">
      <!-- 保存先と認証・CSRF対策はアプリ側で接続します。 -->
      <section class="ui-section">
        <h2 class="ui-section-title">基本情報</h2>
        <div class="field">
          <label for="workspace-name">ワークスペース名</label>
          <input class="form-control" id="workspace-name" name="workspace-name" type="text" value="木の葉制作室" required maxlength="80">
        </div>
        <div class="field">
          <label for="contact-email">連絡先メール</label>
          <input class="form-control" id="contact-email" name="contact-email" type="email" value="team@example.com" required autocomplete="email">
        </div>
      </section>
      <section class="ui-section ui-stack">
        <h2 class="ui-section-title">通知</h2>
        <label class="form-check"><input class="form-check-input" type="checkbox" name="weekly-report" checked>週次レポートをメールで受け取る</label>
        <label class="switch"><input type="checkbox" role="switch" name="mentions" checked>メンションを通知する</label>
      </section>
      <div class="ui-cluster">
        <button class="btn btn-primary" type="submit" >変更を保存</button>
        <button class="btn btn-outline-secondary" type="reset" >変更を取り消す</button>
      </div>
    </form>
  </div>
</div>
<!-- kav-sample:end -->
    </main>
    <footer class="ui-footer">
      <div class="ui-container ui-footer-inner">
        <p>Workspace · Kav-UI サービステンプレート</p>
        <div class="ui-cluster">
          <a href="../templates.html">テンプレート一覧</a>
          <a href="../index.html">UIカタログ</a>
        </div>
      </div>
    </footer>
  </body>
</html>
