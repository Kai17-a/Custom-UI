<!doctype html>
<html lang="ja" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>チームへようこそ — 木の葉制作室</title>
    <!-- Apply the saved theme before stylesheets or deferred UI scripts can paint. -->
    <script src="../assets/ui/js/theme-init.js"></script>
    <link rel="stylesheet" href="../assets/ui/css/ui.css">
    <link rel="stylesheet" href="../assets/css/templates.css">
    <script defer src="../assets/ui/js/ui.js"></script>
    <script defer src="../assets/js/templates.js"></script>

<!-- Kav-UI AI discovery -->
<link rel="describedby" type="text/plain" href="../llms.txt">
<link rel="alternate" type="text/markdown" href="auth.html.md">
<!-- /Kav-UI AI discovery -->
</head>
  <body class="ui-app service-template" data-template="auth" data-ui-theme-persist>
    <a class="template-skip" href="#main">コンテンツへ移動</a>
    <header class="ui-header ui-header-sticky">
      <div class="ui-container ui-header-inner">
        <a class="ui-brand" href="../index.html"><span class="template-brand-mark" icon="mdi-view-dashboard" aria-hidden="true"></span> Workspace</a>
        <div class="ui-header-actions sp-gap-1">
          <label class="fx-inline fx-items-center small sp-gap-1 type-nowrap">
            <span>デザイン</span>
            <select class="form-select form-select-sm ui-w-auto" data-ui-theme-select>
              <option value="default">標準</option>
              <option value="glass">ガラス</option>
              <option value="glassmorphism">グラスモーフィズム</option>
              <option value="flat">フラット</option>
              <option value="soft">ソフト</option>
            </select>
          </label>
          <label class="fx-inline fx-items-center small sp-gap-1 type-nowrap">
            <span>配色</span>
            <select class="form-select form-select-sm ui-w-auto" data-ui-palette-select>
              <option value="default">標準</option>
              <option value="slate">スレート</option>
              <option value="sage">セージ</option>
              <option value="teal">ティール</option>
              <option value="mauve">モーブ</option>
              <option value="sand">サンド</option>
              <option value="clay">クレイ</option>
            </select>
          </label>
          <button type="button" class="btn btn-sm btn-outline-secondary btn-icon-only" data-ui-toggle="theme" data-ui-theme-icon icon="mdi-weather-night" aria-label="ダークに切替" title="ダークに切替"></button>
        </div>
      </div>
    </header>
    <main id="main" class="ui-container ui-layout ui-app-main">
<!-- kav-sample:start -->
<div class="ui-container ui-container-sm ui-page">
  <div class="fx-grid fx-justify-center">
    <article class="ui-card fx-col-md-8">
      <div class="ui-card-body ui-page-body">
        <header class="ui-page-header">
          <div class="ui-page-heading">
            <p class="ui-page-eyebrow">木の葉制作室</p>
            <h1 class="ui-page-title">チームへようこそ</h1>
            <p class="ui-page-description">木の葉制作室の作業スペースにアクセスします。</p>
          </div>
        </header>
        <!-- 認証・登録・エラー表示はアプリ側で接続します。 -->
        <div data-ui-tabs>
          <div class="tabs" role="tablist" aria-label="アカウント">
            <button type="button" data-ui-toggle="tab" data-ui-target="signin" aria-selected="true">ログイン</button>
            <button type="button" data-ui-toggle="tab" data-ui-target="signup">新規登録</button>
          </div>
          <section class="tab-panel ui-stack" data-ui-panel="signin">
            <h2>ログイン</h2>
            <form class="ui-stack" data-ui-validate action="/session" method="post">
              <div class="field">
                <label for="login-email">メールアドレス</label>
                <input class="form-control" id="login-email" name="login-email" type="email" value="" required autocomplete="username">
              </div>
              <div class="field">
                <label for="login-password">パスワード</label>
                <input class="form-control" id="login-password" name="login-password" type="password" value="" required autocomplete="current-password">
              </div>
              <div class="ui-cluster"><button class="btn btn-primary" type="submit">ログイン</button></div>
            </form>
          </section>
          <section class="tab-panel ui-stack" data-ui-panel="signup" hidden>
            <h2>新規登録</h2>
            <form class="ui-stack" data-ui-validate action="/accounts" method="post">
              <div class="field">
                <label for="signup-name">表示名</label>
                <input class="form-control" id="signup-name" name="signup-name" type="text" value="" required autocomplete="nickname">
              </div>
              <div class="field">
                <label for="signup-email">メールアドレス</label>
                <input class="form-control" id="signup-email" name="signup-email" type="email" value="" required autocomplete="email">
              </div>
              <div class="field">
                <label for="signup-password">パスワード（12文字以上）</label>
                <input class="form-control" id="signup-password" name="signup-password" type="password" value="" required minlength="12" autocomplete="new-password">
              </div>
              <div class="ui-cluster"><button class="btn btn-primary" type="submit">アカウントを作成</button></div>
            </form>
          </section>
        </div>
      </div>
    </article>
  </div>
</div>
<!-- kav-sample:end -->
    </main>
    <footer class="ui-footer">
      <div class="ui-container ui-footer-inner">
        <p>Workspace · Kav-UI サービステンプレート</p>
        <div class="ui-cluster">
          <a href="../templates.html">テンプレート一覧</a>
          <a href="../index.html">UIカタログ</a>
        </div>
      </div>
    </footer>
  </body>
</html>
